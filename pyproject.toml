[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-strategy-core"
version = "0.1.0"
description = "Deterministic strategy and feature primitives shared by Crypto Strategy Lab and live runtimes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2,<3",
]

[tool.setuptools.packages.find]
include = ["crypto_strategy_core*"]

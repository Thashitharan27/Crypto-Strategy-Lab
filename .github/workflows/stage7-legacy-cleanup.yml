name: Stage 7 legacy cleanup
on:
  push:
    branches: [chatgpt/stage7-legacy-gui-reporting-cleanup]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage7-legacy-gui-reporting-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply cleanup
        run: python tools/stage7_remove_global_special_exit_legacy.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests
      - name: Run focused safety tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_stage7_global_special_exit_legacy_removed.py tests/test_stage6_profile_exit_management.py tests/test_strategy_profiles.py tests/test_gui_main_window.py tests/test_gui_config_logic.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab tests/test_stage7_global_special_exit_legacy_removed.py
          git diff --cached --quiet || git commit -m "Remove global special-exit legacy controls"
          git push

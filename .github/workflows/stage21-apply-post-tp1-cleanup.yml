name: Stage 21 apply post-TP1 cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/stage21-remove-post-tp1-stop-duplication'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 21 cleanup
        run: python tools/stage21_remove_post_tp1_stop.py
      - name: Compile changed source and tests
        run: |
          python -m py_compile \
            crypto_strategy_lab/strategy_profiles.py \
            crypto_strategy_lab/config.py \
            crypto_strategy_lab/trade.py \
            crypto_strategy_lab/engine.py \
            crypto_strategy_lab/gui/profile_editor.py \
            tests/test_partial_take_profit.py \
            tests/test_strategy_profiles.py \
            tests/test_gui_main_window.py
      - name: Run focused Stage 21 tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/test_partial_take_profit.py \
            tests/test_partial_stop_loss.py \
            tests/test_strategy_profiles.py \
            tests/test_gui_main_window.py -q
      - name: Commit applied cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab tests
          git commit -m "Stage 21: make break-even own post-TP1 protection"
          git push origin HEAD:${{ github.head_ref }}

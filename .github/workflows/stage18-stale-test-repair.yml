name: Stage 18 stale test repair

on:
  push:
    branches: [chatgpt/stage18-repair-stale-full-suite-tests]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/stage18-repair-stale-full-suite-tests
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 18 repairs
        run: python tools/stage18_repair_stale_tests.py
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Commit repaired tests and UI text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_github_manager.py tests/test_gui_main_window.py crypto_strategy_lab/gui/main_window.py
          git diff --cached --quiet || git commit -m "Repair stale full-suite regressions"
          git push
      - name: Run focused regressions
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_github_manager.py
          tests/test_gui_main_window.py
          tests/test_stage16_hidden_pair_management_gui_removed.py
      - name: Run full suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

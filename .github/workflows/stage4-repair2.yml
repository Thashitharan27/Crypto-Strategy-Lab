name: Stage 4 validation repair
on:
  push:
    branches: ["chatgpt/stage4-remove-legacy-di-rr"]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Apply Stage 4 validation repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage4-remove-legacy-di-rr
      - run: python tools/stage4_repair2.py
      - run: python -m compileall -q crypto_strategy_lab tests
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Thashitharan27@users.noreply.github.com"
          git add crypto_strategy_lab/gui/config_logic.py
          git commit -m "Apply Stage 4 validation repair"
          git push

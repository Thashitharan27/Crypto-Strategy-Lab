name: Stage 25 apply mean reversion analysis

on:
  push:
    branches:
      - chatgpt/stage25-mean-reversion-analysis
    paths:
      - .github/workflows/stage25_apply_mean_reversion.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/stage25-mean-reversion-analysis
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 25 migration
        run: python tools/stage25_mean_reversion_analysis.py
      - name: Compile changed code
        run: |
          python -m py_compile crypto_strategy_lab/config.py crypto_strategy_lab/gui/config_logic.py crypto_strategy_lab/gui/main_window.py crypto_strategy_lab/engine.py crypto_strategy_lab/statistics.py crypto_strategy_lab/cli.py crypto_strategy_lab/gui/worker.py crypto_strategy_lab/mean_reversion.py tests/test_stage25_mean_reversion_analysis.py
      - name: Run focused tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_stage25_mean_reversion_analysis.py tests/test_di_pressure.py tests/test_di_direction_pressure_tab.py tests/test_gui_config_logic.py tests/test_gui_main_window.py -q
      - name: Commit applied changes
        run: |
          git config user.name "chatgpt-stage25"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_strategy_lab
          git diff --cached --quiet && exit 0
          git commit -m "Stage 25: add analysis-only mean reversion telemetry"
          git push origin HEAD:chatgpt/stage25-mean-reversion-analysis

# Retriggered after branch setup so the migration runs on the complete Stage 25 scaffold.

name: Stage 20 apply profile UI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/stage20-strategy-profile-exit-ui'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 20 UI migration
        run: python tools/stage20_profile_exit_ui.py
      - name: Compile changed Python
        run: python -m py_compile crypto_strategy_lab/gui/profile_editor.py tests/test_gui_main_window.py
      - name: Run focused GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_gui_main_window.py -q
      - name: Commit applied UI cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/profile_editor.py tests/test_gui_main_window.py
          git commit -m "Stage 20: reorganize Strategy Profile exit UI"
          git push origin HEAD:${{ github.head_ref }}

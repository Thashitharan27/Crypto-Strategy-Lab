name: Stage 19 apply current config contract

on:
  pull_request:
    branches: [ main ]
    types: [reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply Stage 19 migration
        run: python tools/stage19_apply_current_contract.py
      - name: Compile changed production files
        run: python -m compileall -q crypto_strategy_lab
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/main_window.py crypto_strategy_lab/gui/profile_editor.py crypto_strategy_lab/engine.py
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Stage 19: remove hidden GUI configuration plumbing"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

name: Fix S/R feature version test

on:
  push:
    branches:
      - feature/sr-evidence-settings

permissions:
  contents: write

jobs:
  fix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sr-evidence-settings
      - name: Update intentional cache-version assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_support_resistance_features.py')
          text = p.read_text(encoding='utf-8')
          old = 'assert engine.support_resistance_feature_source == "support_resistance@2"'
          new = 'assert engine.support_resistance_feature_source == "support_resistance@3"'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one old S/R version assertion')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_support_resistance_features.py
          git commit -m "Update S/R feature cache version assertion"
          git push origin HEAD:feature/sr-evidence-settings

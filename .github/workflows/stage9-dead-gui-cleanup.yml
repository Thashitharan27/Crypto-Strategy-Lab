name: Stage 9 dead GUI cleanup
on:
  push:
    branches: [chatgpt/stage9-remove-dead-regime-gui-remnants]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message != 'Apply Stage 9 dead GUI cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage9-remove-dead-regime-gui-remnants
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply cleanup
        run: python tools/stage9_remove_dead_regime_gui.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests
      - name: Run focused safety tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_stage9_dead_regime_gui_removed.py tests/test_stage4_legacy_rr_removed.py tests/test_gui_main_window.py tests/test_strategy_profiles.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/main_window.py tests/test_stage9_dead_regime_gui_removed.py
          git commit -m "Apply Stage 9 dead GUI cleanup"
          git push origin HEAD:chatgpt/stage9-remove-dead-regime-gui-remnants

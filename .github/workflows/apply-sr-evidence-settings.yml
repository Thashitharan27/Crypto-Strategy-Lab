name: Apply S/R evidence settings refactor

on:
  push:
    branches:
      - feature/sr-evidence-settings

permissions:
  contents: write

jobs:
  apply-refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sr-evidence-settings
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Apply refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) FeatureConfig: keep historical shared detection defaults, add per-timeframe
          # overrides that inherit with 0, and make hold confirmation the normal default.
          replace_once(
              'crypto_strategy_lab/data_lake_config.py',
              '''    sr_pivot_left: int = 5\n    sr_pivot_right: int = 5\n    sr_lookback_bars: int = 200\n    sr_zone_width_atr: float = 0.5\n    sr_near_distance_atr: float = 0.75\n    enable_sr_hold_confirmation: bool = False\n''',
              '''    sr_pivot_left: int = 5\n    sr_pivot_right: int = 5\n    sr_lookback_bars: int = 200\n    # Per-timeframe detection overrides. 0 means inherit the shared values above,\n    # preserving historical configs while allowing each S/R context to have an\n    # appropriate structural horizon.\n    sr_15m_pivot_left: int = 0\n    sr_15m_pivot_right: int = 0\n    sr_15m_lookback_bars: int = 0\n    sr_1h_pivot_left: int = 0\n    sr_1h_pivot_right: int = 0\n    sr_1h_lookback_bars: int = 0\n    sr_4h_pivot_left: int = 0\n    sr_4h_pivot_right: int = 0\n    sr_4h_lookback_bars: int = 0\n    sr_1d_pivot_left: int = 0\n    sr_1d_pivot_right: int = 0\n    sr_1d_lookback_bars: int = 0\n    sr_zone_width_atr: float = 0.5\n    sr_near_distance_atr: float = 0.75\n    # Retained in the native config for old files/API compatibility. The GUI no\n    # longer exposes this switch and normal research keeps confirmation enabled.\n    enable_sr_hold_confirmation: bool = True\n'''
          )

          replace_once(
              'crypto_strategy_lab/data_lake_config.py',
              '''    def registry_parameters(self, *, strategy_timeframe_minutes: int | None = None) -> dict[str, dict[str, Any]]:\n        \"\"\"Authoritative registered-feature parameters owned by FeatureConfig.\"\"\"\n''',
              '''    def sr_detection_parameters(self, timeframe_minutes: int) -> dict[str, int]:\n        \"\"\"Resolve pivot/lookback settings for one independent S/R timeframe.\n\n        A zero timeframe-specific value inherits the historical shared setting.\n        This keeps old saved configurations stable while making 15m/1h/4h/1d\n        structural sensitivity independently configurable.\n        \"\"\"\n        result = {\n            \"sr_pivot_left\": int(self.sr_pivot_left),\n            \"sr_pivot_right\": int(self.sr_pivot_right),\n            \"sr_lookback_bars\": int(self.sr_lookback_bars),\n        }\n        label = {15: \"15m\", 60: \"1h\", 240: \"4h\", 1440: \"1d\"}.get(\n            int(timeframe_minutes)\n        )\n        if label is None:\n            return result\n        for key in (\"pivot_left\", \"pivot_right\", \"lookback_bars\"):\n            override = int(getattr(self, f\"sr_{label}_{key}\"))\n            if override < 0:\n                raise ValueError(f\"sr_{label}_{key} must be zero (inherit) or positive\")\n            if override:\n                result[f\"sr_{key}\"] = override\n        return result\n\n    def sr_detection_override_parameters(self) -> dict[str, int]:\n        \"\"\"Return raw per-timeframe overrides for feature-cache identity.\"\"\"\n        return {\n            f\"sr_{label}_{key}\": int(getattr(self, f\"sr_{label}_{key}\"))\n            for label in (\"15m\", \"1h\", \"4h\", \"1d\")\n            for key in (\"pivot_left\", \"pivot_right\", \"lookback_bars\")\n        }\n\n    def registry_parameters(self, *, strategy_timeframe_minutes: int | None = None) -> dict[str, dict[str, Any]]:\n        \"\"\"Authoritative registered-feature parameters owned by FeatureConfig.\"\"\"\n'''
          )

          replace_once(
              'crypto_strategy_lab/data_lake_config.py',
              '''                \"sr_pivot_left\": int(self.sr_pivot_left),\n                \"sr_pivot_right\": int(self.sr_pivot_right),\n                \"sr_lookback_bars\": int(self.sr_lookback_bars),\n                \"sr_zone_width_atr\": float(self.sr_zone_width_atr),\n                \"sr_near_distance_atr\": float(self.sr_near_distance_atr),\n                \"enable_sr_hold_confirmation\": bool(self.enable_sr_hold_confirmation),\n''',
              '''                **self.sr_detection_parameters(effective_sr),\n                **self.sr_detection_override_parameters(),\n                \"sr_zone_width_atr\": float(self.sr_zone_width_atr),\n                \"sr_near_distance_atr\": float(self.sr_near_distance_atr),\n                \"enable_sr_hold_confirmation\": bool(self.enable_sr_hold_confirmation),\n'''
          )

          # 2) Prepared S/R feature: accept the overrides and resolve them from the
          # actual context timeframe (important because independent contexts clone the
          # same base parameter set and only change sr_timeframe_minutes).
          replace_once(
              'crypto_strategy_lab/features/support_resistance.py',
              'SUPPORT_RESISTANCE_FEATURE_VERSION = "2"',
              'SUPPORT_RESISTANCE_FEATURE_VERSION = "3"'
          )
          replace_once(
              'crypto_strategy_lab/features/support_resistance.py',
              '''            \"sr_pivot_left\": ParameterDefinition(int, 5),\n            \"sr_pivot_right\": ParameterDefinition(int, 5),\n            \"sr_lookback_bars\": ParameterDefinition(int, 200),\n            \"sr_zone_width_atr\": ParameterDefinition(float, 0.5),\n            \"sr_near_distance_atr\": ParameterDefinition(float, 0.75),\n            \"enable_sr_hold_confirmation\": ParameterDefinition(bool, False),\n''',
              '''            \"sr_pivot_left\": ParameterDefinition(int, 5),\n            \"sr_pivot_right\": ParameterDefinition(int, 5),\n            \"sr_lookback_bars\": ParameterDefinition(int, 200),\n            \"sr_15m_pivot_left\": ParameterDefinition(int, 0),\n            \"sr_15m_pivot_right\": ParameterDefinition(int, 0),\n            \"sr_15m_lookback_bars\": ParameterDefinition(int, 0),\n            \"sr_1h_pivot_left\": ParameterDefinition(int, 0),\n            \"sr_1h_pivot_right\": ParameterDefinition(int, 0),\n            \"sr_1h_lookback_bars\": ParameterDefinition(int, 0),\n            \"sr_4h_pivot_left\": ParameterDefinition(int, 0),\n            \"sr_4h_pivot_right\": ParameterDefinition(int, 0),\n            \"sr_4h_lookback_bars\": ParameterDefinition(int, 0),\n            \"sr_1d_pivot_left\": ParameterDefinition(int, 0),\n            \"sr_1d_pivot_right\": ParameterDefinition(int, 0),\n            \"sr_1d_lookback_bars\": ParameterDefinition(int, 0),\n            \"sr_zone_width_atr\": ParameterDefinition(float, 0.5),\n            \"sr_near_distance_atr\": ParameterDefinition(float, 0.75),\n            \"enable_sr_hold_confirmation\": ParameterDefinition(bool, True),\n'''
          )

          replace_once(
              'crypto_strategy_lab/features/support_resistance.py',
              '''        detector_config = {\n            \"pivot_left\": int(parameters.get(\"sr_pivot_left\", 5)),\n            \"pivot_right\": int(parameters.get(\"sr_pivot_right\", 5)),\n            \"lookback_bars\": int(parameters.get(\"sr_lookback_bars\", 200)),\n            \"zone_width_atr\": float(parameters.get(\"sr_zone_width_atr\", 0.5)),\n            \"near_distance_atr\": float(parameters.get(\"sr_near_distance_atr\", 0.75)),\n            \"enable_hold_confirmation\": bool(parameters.get(\"enable_sr_hold_confirmation\", False)),\n            \"hold_confirmation_bars\": int(parameters.get(\"sr_hold_confirmation_bars\", 3)),\n            \"hold_confirmation_atr\": float(parameters.get(\"sr_hold_confirmation_atr\", 0.25)),\n            \"break_tolerance_atr\": float(parameters.get(\"sr_break_tolerance_atr\", 0.25)),\n            \"break_basis\": str(parameters.get(\"sr_break_basis\", \"CLOSE\")).upper(),\n        }\n        strategy_minutes = int(interval_to_timedelta(request.strategy_interval).total_seconds() // 60)\n        configured_minutes = int(parameters.get(\"sr_timeframe_minutes\", 0) or 0)\n        effective_minutes = configured_minutes or strategy_minutes\n        atr_period = int(parameters.get(\"atr_period\", 14))\n''',
              '''        strategy_minutes = int(interval_to_timedelta(request.strategy_interval).total_seconds() // 60)\n        configured_minutes = int(parameters.get(\"sr_timeframe_minutes\", 0) or 0)\n        effective_minutes = configured_minutes or strategy_minutes\n        atr_period = int(parameters.get(\"atr_period\", 14))\n\n        shared_detection = {\n            \"pivot_left\": int(parameters.get(\"sr_pivot_left\", 5)),\n            \"pivot_right\": int(parameters.get(\"sr_pivot_right\", 5)),\n            \"lookback_bars\": int(parameters.get(\"sr_lookback_bars\", 200)),\n        }\n        timeframe_label = {15: \"15m\", 60: \"1h\", 240: \"4h\", 1440: \"1d\"}.get(\n            effective_minutes\n        )\n        resolved_detection = dict(shared_detection)\n        if timeframe_label is not None:\n            for key in (\"pivot_left\", \"pivot_right\", \"lookback_bars\"):\n                override = int(parameters.get(f\"sr_{timeframe_label}_{key}\", 0) or 0)\n                if override < 0:\n                    raise ValueError(\n                        f\"sr_{timeframe_label}_{key} must be zero (inherit) or positive\"\n                    )\n                if override:\n                    resolved_detection[key] = override\n\n        detector_config = {\n            **resolved_detection,\n            \"zone_width_atr\": float(parameters.get(\"sr_zone_width_atr\", 0.5)),\n            \"near_distance_atr\": float(parameters.get(\"sr_near_distance_atr\", 0.75)),\n            \"enable_hold_confirmation\": bool(parameters.get(\"enable_sr_hold_confirmation\", True)),\n            \"hold_confirmation_bars\": int(parameters.get(\"sr_hold_confirmation_bars\", 3)),\n            \"hold_confirmation_atr\": float(parameters.get(\"sr_hold_confirmation_atr\", 0.25)),\n            \"break_tolerance_atr\": float(parameters.get(\"sr_break_tolerance_atr\", 0.25)),\n            \"break_basis\": str(parameters.get(\"sr_break_basis\", \"CLOSE\")).upper(),\n        }\n'''
          )

          # 3) Shared causal helper/defaults: confirmation is part of normal evidence.
          replace_once(
              'crypto_strategy_core/support_resistance_evidence.py',
              '    enable_hold_confirmation: bool = False,',
              '    enable_hold_confirmation: bool = True,'
          )

          # 4) Warm-up: calculate each independent timeframe using its own resolved
          # structural horizon rather than multiplying the largest timeframe by one
          # shared bar count.
          replace_once(
              'crypto_strategy_lab/research_warmup.py',
              '''        # Independent S/R outputs must be fully warmed at the research boundary,\n        # otherwise an early 1h/4h/1d rule would compare against incomplete\n        # structure simply because the run started recently.\n        sr_minutes = max(configured_sr_minutes, *independent_sr_minutes)\n        sr_bars = (\n            int(features.sr_lookback_bars)\n            + max(int(features.sr_pivot_left), int(features.sr_pivot_right))\n            + (\n                int(features.sr_hold_confirmation_bars)\n                if bool(features.enable_sr_hold_confirmation)\n                else 0\n            )\n            + 5\n        )\n        duration = max(duration, pd.Timedelta(minutes=sr_minutes * sr_bars))\n''',
              '''        # Independent S/R outputs must be fully warmed at the research boundary.\n        # Each timeframe gets its own pivot/lookback horizon; using one shared bar\n        # count for 15m and 1d would give those settings very different meanings.\n        for sr_minutes in sorted({configured_sr_minutes, *independent_sr_minutes}):\n            if hasattr(features, \"sr_detection_parameters\"):\n                detection = features.sr_detection_parameters(sr_minutes)\n                pivot_left = int(detection[\"sr_pivot_left\"])\n                pivot_right = int(detection[\"sr_pivot_right\"])\n                lookback_bars = int(detection[\"sr_lookback_bars\"])\n            else:\n                pivot_left = int(features.sr_pivot_left)\n                pivot_right = int(features.sr_pivot_right)\n                lookback_bars = int(features.sr_lookback_bars)\n            sr_bars = (\n                lookback_bars\n                + max(pivot_left, pivot_right)\n                + (\n                    int(features.sr_hold_confirmation_bars)\n                    if bool(features.enable_sr_hold_confirmation)\n                    else 0\n                )\n                + 5\n            )\n            duration = max(duration, pd.Timedelta(minutes=sr_minutes * sr_bars))\n'''
          )

          # 5) GUI dataclass form must own the new fields even though the friendly
          # research panel will compose them into a compact per-timeframe grid.
          replace_once(
              'crypto_strategy_lab/gui/v2_main_window.py',
              '''        \"sr_pivot_left\", \"sr_pivot_right\", \"sr_lookback_bars\",\n        \"sr_zone_width_atr\", \"sr_near_distance_atr\",\n        \"enable_sr_hold_confirmation\", \"sr_hold_confirmation_bars\",\n''',
              '''        \"sr_pivot_left\", \"sr_pivot_right\", \"sr_lookback_bars\",\n        \"sr_15m_pivot_left\", \"sr_15m_pivot_right\", \"sr_15m_lookback_bars\",\n        \"sr_1h_pivot_left\", \"sr_1h_pivot_right\", \"sr_1h_lookback_bars\",\n        \"sr_4h_pivot_left\", \"sr_4h_pivot_right\", \"sr_4h_lookback_bars\",\n        \"sr_1d_pivot_left\", \"sr_1d_pivot_right\", \"sr_1d_lookback_bars\",\n        \"sr_zone_width_atr\", \"sr_near_distance_atr\",\n        \"enable_sr_hold_confirmation\", \"sr_hold_confirmation_bars\",\n'''
          )
          replace_once(
              'crypto_strategy_lab/gui/v2_main_window.py',
              '''                \"sr_timeframe_minutes\", \"sr_pivot_left\", \"sr_pivot_right\", \"sr_lookback_bars\",\n                \"sr_zone_width_atr\", \"sr_near_distance_atr\", \"enable_sr_hold_confirmation\",\n''',
              '''                \"sr_timeframe_minutes\", \"sr_pivot_left\", \"sr_pivot_right\", \"sr_lookback_bars\",\n                \"sr_15m_pivot_left\", \"sr_15m_pivot_right\", \"sr_15m_lookback_bars\",\n                \"sr_1h_pivot_left\", \"sr_1h_pivot_right\", \"sr_1h_lookback_bars\",\n                \"sr_4h_pivot_left\", \"sr_4h_pivot_right\", \"sr_4h_lookback_bars\",\n                \"sr_1d_pivot_left\", \"sr_1d_pivot_right\", \"sr_1d_lookback_bars\",\n                \"sr_zone_width_atr\", \"sr_near_distance_atr\", \"enable_sr_hold_confirmation\",\n'''
          )

          # 6) Friendly Research Features panel: no hold enable checkbox. Hold
          # confirmation is always present as evidence, while its definition remains
          # configurable. Detection horizons are shown compactly per timeframe.
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''    QCheckBox,\n    QComboBox,\n    QFormLayout,\n    QGroupBox,\n''',
              '''    QCheckBox,\n    QComboBox,\n    QFormLayout,\n    QGridLayout,\n    QGroupBox,\n'''
          )
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''    \"sr_lookback_bars\": \"Lookback bars\",\n    \"sr_zone_width_atr\": \"Zone width\",\n''',
              '''    \"sr_lookback_bars\": \"Lookback bars\",\n    \"sr_15m_pivot_left\": \"15m pivot left\",\n    \"sr_15m_pivot_right\": \"15m pivot right\",\n    \"sr_15m_lookback_bars\": \"15m lookback\",\n    \"sr_1h_pivot_left\": \"1h pivot left\",\n    \"sr_1h_pivot_right\": \"1h pivot right\",\n    \"sr_1h_lookback_bars\": \"1h lookback\",\n    \"sr_4h_pivot_left\": \"4h pivot left\",\n    \"sr_4h_pivot_right\": \"4h pivot right\",\n    \"sr_4h_lookback_bars\": \"4h lookback\",\n    \"sr_1d_pivot_left\": \"1d pivot left\",\n    \"sr_1d_pivot_right\": \"1d pivot right\",\n    \"sr_1d_lookback_bars\": \"1d lookback\",\n    \"sr_zone_width_atr\": \"Zone width\",\n'''
          )
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''        self._add_fields(\n            self.sr_card,\n            (\n                \"sr_pivot_left\",\n                \"sr_pivot_right\",\n                \"sr_lookback_bars\",\n                \"sr_zone_width_atr\",\n                \"sr_near_distance_atr\",\n                \"enable_sr_hold_confirmation\",\n                \"sr_hold_confirmation_bars\",\n                \"sr_hold_confirmation_atr\",\n                \"sr_break_tolerance_atr\",\n                \"sr_break_basis\",\n            ),\n        )\n''',
              '''        self.sr_detection_box = QGroupBox(\"Detection sensitivity by timeframe\")\n        detection = QGridLayout(self.sr_detection_box)\n        detection.addWidget(QLabel(\"Context\"), 0, 0)\n        detection.addWidget(QLabel(\"Pivot left\"), 0, 1)\n        detection.addWidget(QLabel(\"Pivot right\"), 0, 2)\n        detection.addWidget(QLabel(\"Lookback bars\"), 0, 3)\n        detection_rows = (\n            (\"Shared fallback\", \"sr_pivot_left\", \"sr_pivot_right\", \"sr_lookback_bars\", False),\n            (\"15m\", \"sr_15m_pivot_left\", \"sr_15m_pivot_right\", \"sr_15m_lookback_bars\", True),\n            (\"1h\", \"sr_1h_pivot_left\", \"sr_1h_pivot_right\", \"sr_1h_lookback_bars\", True),\n            (\"4h\", \"sr_4h_pivot_left\", \"sr_4h_pivot_right\", \"sr_4h_lookback_bars\", True),\n            (\"1d\", \"sr_1d_pivot_left\", \"sr_1d_pivot_right\", \"sr_1d_lookback_bars\", True),\n        )\n        for row, (label, left_name, right_name, lookback_name, override) in enumerate(\n            detection_rows, 1\n        ):\n            detection.addWidget(QLabel(label), row, 0)\n            for column, name in enumerate((left_name, right_name, lookback_name), 1):\n                widget = self.widgets[name]\n                if override and hasattr(widget, \"setSpecialValueText\"):\n                    widget.setMinimum(0)\n                    widget.setSpecialValueText(\"Shared\")\n                    widget.setToolTip(\n                        \"0/Shared inherits the shared fallback. Set a positive value only when \"\n                        \"this timeframe needs a different structural horizon.\"\n                    )\n                detection.addWidget(widget, row, column)\n        detection_note = QLabel(\n            \"Bar counts are timeframe-specific: 5 confirmation bars means 75 minutes on 15m, \"\n            \"5 hours on 1h, 20 hours on 4h and 5 days on 1d. Leave an override on Shared \"\n            \"until research justifies changing it.\"\n        )\n        detection_note.setWordWrap(True)\n        detection_note.setStyleSheet(\"color:#52606d\")\n        detection.addWidget(detection_note, 6, 0, 1, 4)\n        self.sr_card.form.addRow(self.sr_detection_box)\n\n        interaction_note = QLabel(\n            \"Level hold confirmation is always calculated as S/R evidence. It does not filter \"\n            \"trades by itself; Entry/Veto/Flip rules decide whether the held/state evidence matters.\"\n        )\n        interaction_note.setWordWrap(True)\n        interaction_note.setStyleSheet(\"color:#52606d\")\n        self.sr_card.form.addRow(interaction_note)\n        self._add_fields(\n            self.sr_card,\n            (\n                \"sr_zone_width_atr\",\n                \"sr_near_distance_atr\",\n                \"sr_hold_confirmation_bars\",\n                \"sr_hold_confirmation_atr\",\n                \"sr_break_tolerance_atr\",\n                \"sr_break_basis\",\n            ),\n        )\n'''
          )
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''        self.widgets[\"enable_sr_hold_confirmation\"].toggled.connect(\n            lambda _checked: self.refresh_visibility()\n        )\n''',
              ''
          )
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''        windows = self.widgets.get(\"trade_flow_windows\")\n''',
              '''        hold_confirmation = self.widgets.get(\"enable_sr_hold_confirmation\")\n        if hold_confirmation is not None:\n            hold_confirmation.setChecked(True)\n            hold_confirmation.setEnabled(False)\n            hold_confirmation.hide()\n        windows = self.widgets.get(\"trade_flow_windows\")\n'''
          )
          replace_once(
              'crypto_strategy_lab/gui/research_feature_ownership.py',
              '''        hold = self.widgets[\"enable_sr_hold_confirmation\"].isChecked()\n        for name in (\"sr_hold_confirmation_bars\", \"sr_hold_confirmation_atr\"):\n            self.sr_card.set_field_visible(name, hold)\n''',
              '''        # The compatibility flag is intentionally normalized to ON in the GUI.\n        # Hold/state evidence is calculated regardless of whether a strategy rule uses it.\n        hold_widget = self.widgets[\"enable_sr_hold_confirmation\"]\n        if not hold_widget.isChecked():\n            hold_widget.blockSignals(True)\n            hold_widget.setChecked(True)\n            hold_widget.blockSignals(False)\n        for name in (\"sr_hold_confirmation_bars\", \"sr_hold_confirmation_atr\"):\n            self.sr_card.set_field_visible(name, True)\n'''
          )

          # 7) Legacy/default surfaces also start with confirmation on. Explicit API
          # callers may still supply False for backwards compatibility.
          for path in ('crypto_strategy_lab/config.py',):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text2 = text.replace('enable_sr_hold_confirmation: bool = False', 'enable_sr_hold_confirmation: bool = True')
              if text2 == text:
                  raise SystemExit(f'{path}: default hold flag pattern not found')
              p.write_text(text2, encoding='utf-8')

          p = Path('crypto_strategy_lab/gui/config_logic.py')
          text = p.read_text(encoding='utf-8')
          text2 = text.replace('"enable_sr_hold_confirmation": False', '"enable_sr_hold_confirmation": True')
          if text2 == text:
              raise SystemExit('config_logic.py: default hold flag pattern not found')
          p.write_text(text2, encoding='utf-8')

          # 8) Regression tests for semantics and backward compatibility.
          Path('tests/test_sr_evidence_settings.py').write_text('''from dataclasses import replace\n\nfrom crypto_strategy_lab.data_lake_config import FeatureConfig, ResearchRunConfig\nfrom crypto_strategy_lab.features.support_resistance import SupportResistanceFeatureProvider\nfrom crypto_strategy_lab.research_warmup import strategy_warmup_period\n\n\ndef test_hold_confirmation_is_the_normal_feature_default():\n    features = FeatureConfig()\n    assert features.enable_sr_hold_confirmation is True\n    definition = SupportResistanceFeatureProvider().definition\n    assert definition.parameters[\"enable_sr_hold_confirmation\"].default is True\n\n\ndef test_timeframe_detection_overrides_inherit_shared_values_until_set():\n    features = FeatureConfig(sr_pivot_left=5, sr_pivot_right=5, sr_lookback_bars=200)\n    assert features.sr_detection_parameters(15) == {\n        \"sr_pivot_left\": 5,\n        \"sr_pivot_right\": 5,\n        \"sr_lookback_bars\": 200,\n    }\n    tuned = replace(\n        features,\n        sr_1d_pivot_left=3,\n        sr_1d_pivot_right=2,\n        sr_1d_lookback_bars=120,\n    )\n    assert tuned.sr_detection_parameters(1440) == {\n        \"sr_pivot_left\": 3,\n        \"sr_pivot_right\": 2,\n        \"sr_lookback_bars\": 120,\n    }\n    # Other timeframes remain untouched.\n    assert tuned.sr_detection_parameters(60)[\"sr_pivot_right\"] == 5\n\n\ndef test_registry_carries_raw_overrides_so_each_independent_context_can_resolve_itself():\n    features = FeatureConfig(\n        enable_support_resistance_analysis=True,\n        sr_1h_pivot_right=4,\n        sr_4h_lookback_bars=150,\n    )\n    params = features.registry_parameters(strategy_timeframe_minutes=15)[\"support_resistance\"]\n    assert params[\"enable_sr_hold_confirmation\"] is True\n    assert params[\"sr_1h_pivot_right\"] == 4\n    assert params[\"sr_4h_lookback_bars\"] == 150\n    # Primary 15m still uses shared values because its overrides are unset.\n    assert params[\"sr_pivot_right\"] == 5\n    assert params[\"sr_lookback_bars\"] == 200\n\n\ndef test_sr_warmup_uses_timeframe_specific_horizon():\n    base = ResearchRunConfig()\n    shared = replace(\n        base,\n        features=replace(\n            base.features,\n            enable_support_resistance_analysis=True,\n            sr_pivot_left=5,\n            sr_pivot_right=5,\n            sr_lookback_bars=200,\n        ),\n    )\n    shorter_daily = replace(\n        shared,\n        features=replace(\n            shared.features,\n            sr_1d_pivot_left=2,\n            sr_1d_pivot_right=2,\n            sr_1d_lookback_bars=100,\n        ),\n    )\n    assert strategy_warmup_period(shorter_daily) < strategy_warmup_period(shared)\n''', encoding='utf-8')
          PY

      - name: Compile changed modules
        run: |
          python -m py_compile \
            crypto_strategy_lab/data_lake_config.py \
            crypto_strategy_lab/features/support_resistance.py \
            crypto_strategy_core/support_resistance_evidence.py \
            crypto_strategy_lab/research_warmup.py \
            crypto_strategy_lab/gui/v2_main_window.py \
            crypto_strategy_lab/gui/research_feature_ownership.py

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"

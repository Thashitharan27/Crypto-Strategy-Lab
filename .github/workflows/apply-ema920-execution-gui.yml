name: Apply EMA 9/20 execution GUI patch

on:
  push:
    branches:
      - feature/ema920-execution-gui

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ema920-execution-gui
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply source patch
        run: python tools/apply_ema920_execution_gui_patch.py
      - name: Compile changed source
        run: python -m compileall crypto_strategy_lab/gui/risk_execution_workspace.py crypto_strategy_lab/gui/risk_execution_install.py
      - name: Run focused GUI regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -q tests/test_risk_execution_workspace.py tests/test_next_candle_open_entry.py tests/test_rule_main_window.py
      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/risk_execution_workspace.py crypto_strategy_lab/gui/risk_execution_install.py tests/test_risk_execution_workspace.py
          git diff --cached --quiet && exit 0
          git commit -m "Expose EMA 9/20 execution plan in GUI"
          git push origin HEAD:feature/ema920-execution-gui

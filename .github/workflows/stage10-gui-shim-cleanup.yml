name: Stage 10 GUI shim cleanup
on:
  push:
    branches: [chatgpt/stage10-remove-stage1-gui-shim]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage10-remove-stage1-gui-shim
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply cleanup
        run: python tools/stage10_remove_stage1_gui_shim.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests app.py
      - name: Run focused safety tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_stage10_stage1_gui_shim_removed.py
          tests/test_di_tab_stage1.py
          tests/test_stage2_regime_permissions_removed.py
          tests/test_strategy_profiles.py
          tests/test_gui_config_logic.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py crypto_strategy_lab/gui/main_window.py crypto_strategy_lab/gui/stage1_window.py tests/test_di_tab_stage1.py tests/test_stage2_regime_permissions_removed.py tests/test_stage10_stage1_gui_shim_removed.py
          git commit -m "Apply Stage 10 GUI shim cleanup"
          git push origin HEAD:chatgpt/stage10-remove-stage1-gui-shim

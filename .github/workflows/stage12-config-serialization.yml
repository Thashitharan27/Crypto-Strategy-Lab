name: Stage 12 config serialization
on:
  push:
    branches: [chatgpt/stage12-config-serialization-contract]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  serialization-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage12-config-serialization-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply Stage 12 cleanup
        run: python tools/stage12_config_serialization_contract.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests app.py
      - name: Run focused safety tests
        run: >-
          python -m pytest -q
          tests/test_stage12_config_serialization_contract.py
          tests/test_gui_config_logic.py
          tests/test_strategy_profiles.py
          tests/test_worker_profile_modes.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/config_logic.py tests/test_gui_config_logic.py tests/test_stage12_config_serialization_contract.py
          git diff --cached --quiet || git commit -m "Apply Stage 12 config serialization contract"
          git push origin HEAD:chatgpt/stage12-config-serialization-contract

name: Stage 4 validation cleanup
on:
  push:
    branches: ["chatgpt/stage4-remove-legacy-di-rr"]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.head_commit.message == 'Add Stage 4 validation cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage4-remove-legacy-di-rr
      - name: Remove stale legacy R:R validation
        shell: python
        run: |
          from pathlib import Path
          path = Path("crypto_strategy_lab/config.py")
          text = path.read_text(encoding="utf-8")
          stale = '        if any(value <= 0 for value in regime_ratios): raise ValueError("DI regime reward/risk ratios must be positive")\n'
          if stale not in text:
              raise SystemExit("stale regime_ratios validation not found")
          path.write_text(text.replace(stale, ""), encoding="utf-8")
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab tools
      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/stage4-validation-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Thashitharan27@users.noreply.github.com"
          git add crypto_strategy_lab/config.py .github/workflows/stage4-validation-cleanup.yml
          git commit -m "Fix stale Stage 4 legacy R:R validation"
          git push

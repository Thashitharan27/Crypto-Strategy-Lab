name: Stage 19 follow-up cleanup

on:
  pull_request:
    branches: [ main ]
    types: [reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply Stage 19 follow-up cleanup
        run: python tools/stage19_followup_cleanup.py
      - name: Compile production files
        run: python -m compileall -q crypto_strategy_lab
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/main_window.py crypto_strategy_lab/gui/profile_editor.py crypto_strategy_lab/engine.py
          if git diff --cached --quiet; then
            echo "No follow-up cleanup changes to commit."
          else
            git commit -m "Stage 19: remove remaining hidden configuration remnants"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

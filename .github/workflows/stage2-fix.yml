name: Stage 2 engine fix
on:
  push:
    branches: ["chatgpt/stage2-remove-legacy-regime-permissions"]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Apply Stage 2 engine indentation fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage2-remove-legacy-regime-permissions
      - run: python tools/stage2_fix_engine_indent.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/engine.py
          git commit -m "Apply Stage 2 engine indentation fix"
          git push

name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: python-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stage18-repair-on-reopen:
    if: github.event_name == 'pull_request' && github.event.action == 'reopened' && github.head_ref == 'chatgpt/stage18-repair-stale-full-suite-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 18 repair
        run: python tools/stage18_repair_full_suite.py
      - name: Compile repaired source
        run: python -m compileall -q crypto_strategy_lab tests
      - name: Run focused engine regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_backtester.py
          tests/test_coin_flip_sizing.py
          tests/test_partial_stop_loss.py
          tests/test_partial_take_profit.py
          tests/test_random_entry.py
          tests/test_remaining_leg_timeout.py
          tests/test_support_resistance.py
          tests/test_trailing_profit.py
      - name: Commit validated repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Stage 18 repair changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/engine.py tests/test_backtester.py tests/test_coin_flip_sizing.py tests/test_partial_stop_loss.py tests/test_partial_take_profit.py tests/test_random_entry.py tests/test_remaining_leg_timeout.py tests/test_support_resistance.py tests/test_trailing_profit.py
          git commit -m "Stage 18: restore completed trade result rows"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  strategy-profile-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Run strategy-profile safety tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_di_direction_pressure_tab.py
          tests/test_stage2_regime_permissions_removed.py
          tests/test_di_pressure.py
          tests/test_strategy_profiles.py
          tests/test_worker_profile_modes.py
          tests/test_gui_config_logic.py

  full-suite-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Run full suite for visibility
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  windows-smoke-safety:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Run Windows smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_chatgpt_connection.py
          tests/test_stage16_hidden_pair_management_gui_removed.py

name: Python tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: python-tests-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  stage25-migration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chatgpt/stage25-mean-reversion-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stage 25 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply migration once
        run: |
          if grep -q 'enable_mean_reversion_analysis: bool' crypto_strategy_lab/config.py; then
            echo "Stage 25 production migration already applied."
            exit 0
          fi
          python tools/stage25_mean_reversion_analysis.py
          python -m py_compile crypto_strategy_lab/config.py crypto_strategy_lab/gui/config_logic.py crypto_strategy_lab/gui/main_window.py crypto_strategy_lab/engine.py crypto_strategy_lab/statistics.py crypto_strategy_lab/cli.py crypto_strategy_lab/gui/worker.py crypto_strategy_lab/mean_reversion.py
          git config user.name "chatgpt-stage25"
          git config user.email "actions@users.noreply.github.com"
          git add crypto_strategy_lab
          git commit -m "Stage 25: add analysis-only mean reversion telemetry"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  strategy-profile-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Run strategy-profile safety tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_di_direction_pressure_tab.py
          tests/test_stage2_regime_permissions_removed.py
          tests/test_di_pressure.py
          tests/test_strategy_profiles.py
          tests/test_worker_profile_modes.py
          tests/test_gui_config_logic.py

  full-suite-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Run full suite for visibility
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  windows-smoke-safety:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Run Windows smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_chatgpt_connection.py
          tests/test_stage16_hidden_pair_management_gui_removed.py

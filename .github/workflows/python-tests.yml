name: Python tests

on:
  push:
    branches: [ main, "chatgpt/**" ]
  pull_request:
    branches: [ main ]

jobs:
  strategy-profile-safety:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile source
        run: python -m compileall -q crypto_strategy_lab mcp_server tools app.py
      - name: Run strategy-profile safety tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_di_direction_pressure_tab.py
          tests/test_stage2_regime_permissions_removed.py
          tests/test_di_pressure.py
          tests/test_strategy_profiles.py
          tests/test_worker_profile_modes.py
          tests/test_gui_config_logic.py

  full-suite-observation:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Run full suite for visibility
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

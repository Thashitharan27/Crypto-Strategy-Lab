name: Stage 15 hidden random and VWAP GUI
on:
  push:
    branches: [chatgpt/stage15-remove-hidden-random-vwap-widgets]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage15-remove-hidden-random-vwap-widgets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply cleanup
        run: python tools/stage15_remove_hidden_random_vwap_widgets.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests app.py
      - name: Run focused safety tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python -m pytest -q
          tests/test_stage15_hidden_random_vwap_gui_removed.py
          tests/test_stage14_hidden_exit_gui_removed.py
          tests/test_strategy_profiles.py
          tests/test_gui_config_logic.py
          tests/test_worker_profile_modes.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/main_window.py tests/test_stage15_hidden_random_vwap_gui_removed.py
          git diff --cached --quiet || git commit -m "Apply Stage 15 hidden random and VWAP GUI cleanup"
          git push origin HEAD:chatgpt/stage15-remove-hidden-random-vwap-widgets

name: Stage 23 apply strategy to all

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/stage23-apply-strategy-to-all'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 23 migration
        run: python tools/stage23_apply_strategy_to_all.py
      - name: Compile changed code and test
        run: |
          python -m py_compile \
            crypto_strategy_lab/gui/profile_editor.py \
            tests/test_stage23_apply_strategy_to_all.py
      - name: Run Stage 23 regression test
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_stage23_apply_strategy_to_all.py tests/test_gui_main_window.py -q
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/profile_editor.py
          git commit -m "Stage 23: apply complete strategy baseline to all profiles"
          git push origin HEAD:${{ github.head_ref }}

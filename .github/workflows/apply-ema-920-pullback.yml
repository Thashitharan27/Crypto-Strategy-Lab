name: Apply EMA 9/20 pullback patch

on:
  push:
    branches: [ feature/ema-9-20-pullback ]

permissions:
  contents: write

concurrency:
  group: ema-920-pullback-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ema-9-20-pullback
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply source patch
        run: python tools/apply_ema_920_pullback_patch.py
      - name: Compile changed source
        run: python -m compileall -q crypto_strategy_core crypto_strategy_lab tests/test_ema_920_pullback_strategy.py
      - name: Run targeted regression tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_ema_920_pullback_strategy.py
          tests/test_dmi_trend_strategy.py
          tests/test_rule_main_window.py
          tests/test_task18_gui_architecture.py
      - name: Commit applied patch
        run: |
          if git diff --quiet --exit-code; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_core/rules.py \
                  crypto_strategy_lab/strategy_rule_model.py \
                  crypto_strategy_lab/gui/rule_strategy_builder.py \
                  crypto_strategy_lab/gui/v2_main_window.py \
                  crypto_strategy_lab/rule_native_engine.py \
                  crypto_strategy_lab/ema_pullback.py \
                  tests/test_ema_920_pullback_strategy.py
          git commit -m "Implement EMA 9/20 pullback scalping strategy"
          git push origin HEAD:feature/ema-9-20-pullback

name: Stage 24 apply support resistance GUI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/stage24-support-resistance-gui'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 24 migration
        run: python tools/stage24_support_resistance_gui.py
      - name: Repair generated summary literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("crypto_strategy_lab/gui/main_window.py")
          text=path.read_text(encoding="utf-8")
          text=text.replace('long_rules.append(f"Minimum room {self.sr_long_min_room_to_resistance_atr.value():.2f} ATR")','long_rules.append(f"Minimum room: {self.sr_long_min_room_to_resistance_atr.value():.2f} ATR")')
          text=text.replace('short_rules.append(f"Minimum room {self.sr_short_min_room_to_support_atr.value():.2f} ATR")','short_rules.append(f"Minimum room: {self.sr_short_min_room_to_support_atr.value():.2f} ATR")')
          start=text.index('        self.sr_summary_label.setText(', text.index('    def _update_sr_tab_state(self):'))
          end=text.index('\n\n    def _build_di_strategy_tab(self):', start)
          replacement='''        self.sr_summary_label.setText(\n            f"Mode: {mode}\\n"\n            f"Detection: {preset}\\n"\n            f"Near level: ≤ {self.sr_near_distance_atr.value():.2f} ATR\\n\\n"\n            f"LONG filters: {long_text}\\n"\n            f"SHORT filters: {short_text}"\n        )'''
          text=text[:start]+replacement+text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Compile changed code and test
        run: |
          python -m py_compile crypto_strategy_lab/gui/main_window.py tests/test_stage24_support_resistance_gui.py
      - name: Run focused S/R GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_stage24_support_resistance_gui.py tests/test_gui_main_window.py tests/test_gui_config_logic.py tests/test_support_resistance.py -q
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/gui/main_window.py
          git commit -m "Stage 24: clarify Support and Resistance GUI"
          git push origin HEAD:${{ github.head_ref }}

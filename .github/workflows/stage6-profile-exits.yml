name: Stage 6 profile exits
on:
  push:
    branches: [chatgpt/stage6-exit-management-review]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage6-exit-management-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply migration
        run: python tools/stage6_profile_exit_management.py
      - name: Compile
        run: python -m compileall -q crypto_strategy_lab tests
      - name: Run focused tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_stage6_profile_exit_management.py tests/test_strategy_profiles.py tests/test_gui_main_window.py
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab tests/test_stage6_profile_exit_management.py
          git diff --cached --quiet || git commit -m "Move special exit management into Strategy Profiles"
          git push

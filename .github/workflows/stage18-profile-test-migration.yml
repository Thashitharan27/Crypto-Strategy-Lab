name: Stage 18 profile test migration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/stage18-repair-stale-full-suite-tests
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Strategy Profile test migration
        run: python tools/stage18_profile_test_migration.py
      - name: Repair duplicate S/R profile kwargs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_support_resistance.py")
          s = p.read_text(encoding="utf-8")
          line = "            enable_strategy_profiles=True, strategy_profiles=default_profiles(),\n"
          duplicate = line + line
          if duplicate not in s:
              raise SystemExit("expected duplicate S/R profile kwargs were not generated")
          s = s.replace(duplicate, line)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Compile source and tests
        run: python -m compileall -q crypto_strategy_lab mcp_server tools tests app.py
      - name: Commit migrated tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_backtester.py tests/test_coin_flip_sizing.py tests/test_partial_stop_loss.py tests/test_partial_take_profit.py tests/test_remaining_leg_timeout.py tests/test_support_resistance.py tests/test_trailing_profit.py
          git diff --cached --quiet || git commit -m "Migrate stale tests to Strategy Profiles"
          git push
      - name: Run full suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

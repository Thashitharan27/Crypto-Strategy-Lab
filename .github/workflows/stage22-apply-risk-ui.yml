name: Stage 22 apply risk UI semantics

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'chatgpt/stage22-clarify-risk-ui-terminology'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt
      - name: Apply Stage 22 migration
        run: python tools/stage22_risk_ui_semantics.py
      - name: Compile changed code and tests
        run: |
          python -m py_compile \
            crypto_strategy_lab/gui/main_window.py \
            crypto_strategy_lab/gui/profile_editor.py \
            crypto_strategy_lab/trade.py \
            crypto_strategy_lab/engine.py \
            crypto_strategy_lab/output_manager.py \
            tests/test_gui_main_window.py \
            tests/test_stage22_risk_semantics.py
      - name: Run focused Stage 22 tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            tests/test_stage22_risk_semantics.py \
            tests/test_gui_main_window.py \
            tests/test_partial_take_profit.py \
            tests/test_partial_stop_loss.py \
            tests/test_strategy_profiles.py -q
      - name: Commit applied changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab tests
          git commit -m "Stage 22: clarify risk UI and trade-R semantics"
          git push origin HEAD:${{ github.head_ref }}

name: Stage 5 CI repair
on:
  push:
    branches: ["chatgpt/stage5-remove-oneoff-legacy-filters"]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'Apply Stage 5 CI repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage5-remove-oneoff-legacy-filters
      - run: python tools/stage5_ci_repair.py
      - run: python -m compileall -q crypto_strategy_lab tests
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+Thashitharan27@users.noreply.github.com"
          git add crypto_strategy_lab
          git commit -m "Apply Stage 5 CI repair"
          git push

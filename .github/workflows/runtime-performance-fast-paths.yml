name: Runtime fast-path safety

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: runtime-fast-paths-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-fast-path-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow
      - name: Compile changed runtime path
        run: >-
          python -m compileall -q
          crypto_strategy_lab/gui/v2_controller.py
          crypto_strategy_lab/research_adapters.py
          crypto_strategy_lab/research_runner.py
          crypto_strategy_lab/research_sampling.py
          crypto_strategy_lab/research_sampling_fast.py
          crypto_strategy_lab/research_sampling_reporting.py
          tests/test_runtime_performance_fast_paths.py
          tests/test_research_sampling_direct_fast.py
          tests/test_research_sampling_postprocess_fast.py
      - name: Run runtime fast-path regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_runtime_performance_fast_paths.py
          tests/test_research_sampling_direct_fast.py
          tests/test_research_sampling_postprocess_fast.py


  walk-forward-event-index-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow
      - name: Compile walk-forward event fast path
        run: >-
          python -m compileall -q
          crypto_strategy_lab/causal_event_index.py
          crypto_strategy_lab/causal_experiment.py
          crypto_strategy_lab/walk_forward_candidate_engine.py
          crypto_strategy_lab/walk_forward_candidate_engine_impl.py
          crypto_strategy_lab/walk_forward_orchestrator_impl.py
          crypto_strategy_lab/walk_forward_orchestrator.py
          crypto_strategy_lab/walk_forward_adaptive_policy.py
          crypto_strategy_lab/walk_forward_adaptive_weekly.py
          crypto_strategy_lab/walk_forward_research_policy.py
          crypto_strategy_lab/walk_forward_rule_validation.py
          mcp_server/control_server.py
          tests/test_causal_experiment.py
          tests/test_walk_forward_review_atomic_validation.py
          tests/test_walk_forward_candidate_engine.py
          tests/test_walk_forward_teacher_learning.py
          tests/test_walk_forward_orchestrator.py
          tests/test_walk_forward_research_policy.py
          tests/test_walk_forward_adaptive_weekly.py
          tests/test_wf_bounded_scan_checkpoints.py
          tests/test_mcp_control_server.py
      - name: Run walk-forward event fast-path tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_causal_experiment.py \
            tests/test_walk_forward_review_atomic_validation.py \
            tests/test_walk_forward_candidate_engine.py \
            tests/test_walk_forward_teacher_learning.py \
            tests/test_walk_forward_research_policy.py \
            tests/test_walk_forward_adaptive_weekly.py \
            tests/test_wf_bounded_scan_checkpoints.py \
            tests/test_walk_forward_orchestrator.py::test_fresh_adaptive_weekly_advances_from_sequence_one_to_first_review \
            tests/test_walk_forward_orchestrator.py::test_adaptive_week_two_uses_post_review_head_for_all_internal_writes \
            tests/test_walk_forward_orchestrator.py::test_advance_rejects_genuine_external_stale_head \
            tests/test_walk_forward_orchestrator.py::test_advance_same_operation_retry_is_idempotent_after_response_loss \
            tests/test_walk_forward_orchestrator.py::test_weekly_batch_auto_executes_without_mid_week_review \
            tests/test_walk_forward_orchestrator.py::test_monthly_batch_auto_executes_loss_without_mid_month_review
          python -m pytest -q \
            tests/test_walk_forward_frozen_resume_safety.py \
            tests/test_mcp_control_server.py

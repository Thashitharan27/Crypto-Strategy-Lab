name: Runtime fast-path safety

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: runtime-fast-paths-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  runtime-fast-path-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile changed runtime path
        run: >-
          python -m compileall -q
          crypto_strategy_lab/gui/v2_controller.py
          crypto_strategy_lab/research_adapters.py
          crypto_strategy_lab/research_runner.py
          crypto_strategy_lab/research_sampling.py
          crypto_strategy_lab/research_sampling_fast.py
          crypto_strategy_lab/research_sampling_reporting.py
          tests/test_runtime_performance_fast_paths.py
          tests/test_research_sampling_direct_fast.py
          tests/test_research_sampling_postprocess_fast.py
      - name: Run runtime fast-path regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_runtime_performance_fast_paths.py
          tests/test_research_sampling_direct_fast.py
          tests/test_research_sampling_postprocess_fast.py


  walk-forward-event-index-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile walk-forward event fast path
        run: >-
          python -m compileall -q
          crypto_strategy_lab/causal_event_index.py
          crypto_strategy_lab/causal_experiment.py
          crypto_strategy_lab/walk_forward_candidate_engine.py
          crypto_strategy_lab/walk_forward_candidate_engine_impl.py
          crypto_strategy_lab/walk_forward_orchestrator_impl.py
          crypto_strategy_lab/walk_forward_rule_validation.py
          tests/test_causal_experiment.py
          tests/test_walk_forward_review_atomic_validation.py
          tests/test_walk_forward_candidate_engine.py
          tests/test_walk_forward_teacher_learning.py
          tests/test_wf_bounded_scan_checkpoints.py
      - name: Run walk-forward event fast-path tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python -m pytest -q
          tests/test_causal_experiment.py
          tests/test_walk_forward_review_atomic_validation.py
          tests/test_walk_forward_candidate_engine.py
          tests/test_walk_forward_teacher_learning.py
          tests/test_wf_bounded_scan_checkpoints.py

name: Stage 3 cleanup

on:
  push:
    branches: ["chatgpt/stage3-remove-legacy-directional-ranges"]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event.head_commit.message != 'Apply Stage 3 directional-range cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage3-remove-legacy-directional-ranges
      - name: Apply deterministic cleanup
        run: python tools/stage3_remove_directional_ranges.py
      - name: Compile changed source
        run: python -m compileall -q crypto_strategy_lab tools
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/config.py crypto_strategy_lab/gui/config_logic.py crypto_strategy_lab/engine.py crypto_strategy_lab/gui/main_window.py tests/test_backtester.py
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
          else
            git commit -m "Apply Stage 3 directional-range cleanup"
            git push
          fi

name: Stage 19 apply cleanup

on:
  pull_request:
    branches: [ main ]
    types: [reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'chatgpt/stage19-remove-legacy-config-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Apply one-shot cleanup
        run: |
          python tools/stage19_remove_strategy_csv.py
          python tools/stage19_engine_profile_only.py
          python tools/stage19_result_schema.py
          python tools/stage19_final_production_cleanup.py
          python tools/stage19_remove_config_invariants.py
          python tools/stage19_migrate_tests.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            crypto_strategy_lab/config.py \
            crypto_strategy_lab/loader.py \
            crypto_strategy_lab/engine.py \
            crypto_strategy_lab/cli.py \
            crypto_strategy_lab/output_manager.py \
            crypto_strategy_lab/report_workbooks.py \
            crypto_strategy_lab/gui/config_logic.py \
            crypto_strategy_lab/gui/main_window.py \
            crypto_strategy_lab/gui/worker.py \
            tests/test_backtester.py \
            tests/test_gui_config_logic.py \
            tests/test_gui_main_window.py \
            tests/test_partial_stop_loss.py \
            tests/test_partial_take_profit.py \
            tests/test_strategy_profiles.py \
            tests/test_support_resistance.py \
            tests/test_sr_reporting.py \
            tests/test_stage15_hidden_random_vwap_gui_removed.py \
            tests/test_trailing_profit.py \
            tests/test_telemetry_enrichment.py \
            tools/stage19_audit_legacy_config.py
      - name: Enforce hard-cleanup audit
        env:
          PYTHONPATH: .
        run: python tools/stage19_audit_legacy_config.py
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab tests tools/stage19_audit_legacy_config.py
          git commit -m "Stage 19: migrate remaining current-contract tests"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

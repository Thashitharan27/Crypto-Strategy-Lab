name: Stage 2 cleanup

on:
  push:
    branches: [ "chatgpt/stage2-remove-legacy-regime-permissions" ]

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.event.head_commit.message != 'Apply Stage 2 regime permission cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/stage2-remove-legacy-regime-permissions
      - name: Apply deterministic cleanup
        run: python tools/stage2_remove_regime_permissions.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crypto_strategy_lab/config.py crypto_strategy_lab/gui/config_logic.py crypto_strategy_lab/engine.py crypto_strategy_lab/gui/main_window.py
          if git diff --cached --quiet; then
            echo "No cleanup changes required"
          else
            git commit -m "Apply Stage 2 regime permission cleanup"
            git push
          fi
